[project]
name = "so101vla"
version = "0.1.0"
description = "SO-101 VLA (SmolVLA) training, DAgger and closed-loop evaluation; RK3588 edge deployment (thesis)"
requires-python = ">=3.12,<3.13"
# Versions match the environment the simulation pre-study ran in (torch 2.7.1+cu118, lerobot 0.6.1, mujoco 3.8.1).
# SO101-Nexus is not installed; it is imported from source via SO101_NEXUS_SOURCE / PYTHONPATH (see README).
dependencies = [
    "lerobot[smolvla,dataset,feetech,viz]==0.6.1",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==2.2.6",
    "transformers==5.5.4",
    "mujoco==3.8.1",
    "gymnasium==1.3.0",
]

[build-system]
requires = ["setuptools>=71"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["so101vla"]

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
